name: Publish reviewed weekly report
on:
  workflow_dispatch:
    inputs:
      approved_sha256:
        description: SHA-256 of the exact public snapshot approved by the editor
        required: true
        type: string
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        id: pages
      - name: Validate reviewed snapshot and build
        env:
          APPROVED_SHA256: ${{ inputs.approved_sha256 }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: python3 build_pages.py --base-path "$BASE_PATH" --approved-sha256 "$APPROVED_SHA256"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v5
        id: deployment
